<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --card-background-color:#fff; --primary-text-color:#212121; --secondary-text-color:#727272; --divider-color:#e0e0e0; --secondary-background-color:#f2f2f2; --primary-color:#03a9f4; }
  body { margin:0; padding:16px; background:#e9ecef; font-family:Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; display:grid; gap:16px; }
  ha-card { display:block; background:var(--card-background-color); border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,.15); color:var(--primary-text-color); }
  ha-icon { display:inline-block; width:1em; height:1em; }
</style></head>
<body><div class="wrap" id="root"></div>
<script src="bundle.js"></script>
<script>
const params = new URLSearchParams(location.search);
const states = (params.get("states") || "accesa,spenta,accensione,spegnimento,non_disponibile").split(",");
const now = Date.now();
function mk(state, i) {
  const power = { accesa: 128.2, spenta: 1.2, accensione: 312, spegnimento: 127.4, non_disponibile: null }[state];
  const since = new Date(now - (state === "accesa" ? 95 : 7) * 60000).toISOString();
  const settings = { off_below:5, ignition_above:250, shutdown_min:126, shutdown_max:129, shutdown_needs_switch_off:true, confirm_seconds:10, grace_seconds:15, restore_delay_seconds:30, sync_switch_on:true, sync_switch_off:true, notify_events:true, notify_sensor_problem:true, notify_service:"", tile_color: params.get("tile") || ["rosso","arancio","avorio","rosso","rosso"][i], show_switch_button:true };
  const info = { entry_id:"e"+i, title:"Stufa a pellet", state, power, since, sources:{power_sensor:"sensor.presa_power", switch:"switch.stufa", plug:"switch.presa", energy_sensor:null}, settings,
    schedule:{ enabled:true, slots:[{days:[0,1,2,3,4],start:"06:30",end:"08:30"},{days:[0,1,2,3,4],start:"17:00",end:"22:00"},{days:[5,6],start:"08:00",end:"23:00"}] },
    mode: params.get("mode") || (state==="accesa"?"programma":"manuale"), timer_until: params.get("mode")==="timer" ? new Date(now+47*60000).toISOString() : null,
    next_event:{kind:"off", time:new Date(now+95*60000).toISOString()}, last_action:null,
    entities:{ modo:"sensor.stufa_modo", stato:"sensor.stufa_stato", accensioni_oggi:"sensor.acc", ore_in_funzione_oggi:"sensor.ore" } };
  const hass = { states:{
    "sensor.stufa_stato":{entity_id:"sensor.stufa_stato", state, attributes:{potenza:power, da:since, interruttore: state==="spenta"?"spento":"acceso", presa: params.get("presa")==="off"?"spenta":"accesa", azioni_bloccate: state==="non_disponibile"}},
    "sensor.stufa_modo":{entity_id:"sensor.stufa_modo", state: info.mode, attributes:{programmazione_attiva:true, timer_fino:info.timer_until, prossima_azione:"spegnimento", prossimo_evento:info.next_event.time}},
    "sensor.acc":{entity_id:"sensor.acc", state:"2", attributes:{}}, "sensor.ore":{entity_id:"sensor.ore", state:"3.4", attributes:{}},
    "sensor.presa_power":{entity_id:"sensor.presa_power", state: power===null?"unavailable":String(power), attributes:{}},
    "switch.stufa":{entity_id:"switch.stufa", state: state==="spenta"?"off":"on", attributes:{}},
    "switch.presa":{entity_id:"switch.presa", state: params.get("presa")==="off"?"off":"on", attributes:{}} },
    callService: async () => {},
    callWS: async (m) => {
      if (m.type === "stufa_pellet/info") return info;
      if (m.type === "stufa_pellet/suggest") return { samples: 4200, days: 14, suggestion: { off_below: 4.5, ignition_above: 255, shutdown_min: 126.2, shutdown_max: 129.2 } };
      if (m.type === "stufa_pellet/schedule") return { schedule: m.schedule };
      if (m.type === "stufa_pellet/timer") return { timer_until: null };
      if (m.type === "stufa_pellet/update") return { settings: m.settings };
      if (m.type === "history/history_during_period") {
        const out = {}, t0 = Date.parse(m.start_time), t1 = Date.parse(m.end_time);
        for (const id of m.entity_ids) {
        if (id === "sensor.stufa_stato") {
          const seq = [["spenta",0],["accensione",.3],["accesa",.31],["spegnimento",.55],["spenta",.58],["accensione",.8],["accesa",.81]];
          out[id] = seq.map(([s,f]) => ({ s, lu: (t0 + (t1-t0)*f)/1000 }));
        } else {
          const pts = []; for (let k=0;k<=300;k++){ const f=k/300, t=t0+(t1-t0)*f;
            let w = 1.2; if (f>.3&&f<.31) w=310; else if (f>=.31&&f<.55) w=70+ (k%7); else if (f>=.55&&f<.58) w=127.5; else if (f>.8&&f<.81) w=305; else if (f>=.81) w=70+(k%5);
            pts.push({ s:String(w), lu:t/1000 }); }
          out[id] = pts;
        }
        }
        return out;
      }
      throw new Error("non gestito " + m.type);
    } };
  return hass;
}
const root = document.getElementById("root");
states.forEach((s, i) => { const el = document.createElement("stufa-pellet-card"); el.setConfig({type:"custom:stufa-pellet-card", compact: params.get("compact")==="1"}); el.hass = mk(s, i); root.appendChild(el); });
const op = params.get('open'); if (op) setTimeout(()=>root.children[0]._open(op), 600);
window.__open = (idx, tag) => { const c = root.children[idx]; c._open(tag); };
</script></body></html>
