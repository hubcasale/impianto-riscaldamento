avvia_timer:
  fields:
    minuti:
      required: true
      example: 90
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
          mode: box
    temperatura:
      example: 21
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    entry_id:
      selector:
        config_entry:
          integration: impianto_riscaldamento

annulla_timer:
  fields:
    entry_id:
      selector:
        config_entry:
          integration: impianto_riscaldamento
